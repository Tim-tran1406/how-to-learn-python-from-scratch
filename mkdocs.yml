site_name: How to Learn Python from Scratch
site_description: A free, beginner-friendly, example-driven guide to mastering Python — fact-checked against the official docs and the best Python books.
site_author: Tim-tran1406
site_url: https://tim-tran1406.github.io/how-to-learn-python-from-scratch/
repo_url: https://github.com/Tim-tran1406/how-to-learn-python-from-scratch
repo_name: Tim-tran1406/how-to-learn-python-from-scratch

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - "Part 1 · Getting Started":
      - "1. What is Python?": part1-getting-started/01-what-is-python.md
      - "2. Install Python & run your first program": part1-getting-started/02-install-and-first-program.md
      - "3. How to use this course": part1-getting-started/03-how-to-use-this-course.md
  - "Part 2 · Python Basics":
      - "1. Variables & data types": part2-basics/01-variables-and-types.md
      - "2. Numbers & math": part2-basics/02-numbers-and-math.md
      - "3. Strings": part2-basics/03-strings.md
      - "4. Booleans & comparisons": part2-basics/04-booleans-and-comparisons.md
      - "5. Input & output": part2-basics/05-input-and-output.md
      - "6. Comments & code style": part2-basics/06-comments-and-style.md
